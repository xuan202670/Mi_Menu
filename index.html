<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><title>Mi Menú</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f4f4;color:#222}header{background:#fff;padding:20px 16px 14px;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd}h1{margin:0;font-size:28px}header p{margin:3px 0 0;color:#666}main{max-width:700px;margin:auto;padding:14px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button,.primary{border:0;border-radius:13px;padding:13px;font-size:15px;background:#222;color:white}.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 5px #0001}.hidden{display:none}.day{padding:12px 0;border-bottom:1px solid #eee}.day:last-child{border-bottom:0}.tag{font-size:12px;font-weight:700;color:#777;text-transform:uppercase}.meal{font-size:17px;margin:4px 0 10px}.buy{display:flex;gap:10px;padding:7px 0}.buy input{width:20px;height:20px}textarea,input[type=text]{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin:7px 0}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.small{font-size:13px;color:#666}.danger{background:#eee!important;color:#222!important}.pill{display:inline-block;background:#eee;border-radius:20px;padding:5px 9px;margin:3px;font-size:13px}</style></head><body><header><h1>🍽️ Mi Menú</h1><p>Planificador familiar · 4 personas</p></header><main><div class="nav"><button onclick="show('today')">🏠 Hoy</button><button onclick="show('week')">📅 Semana</button><button onclick="show('shop')">🛒 Compra</button><button onclick="show('home')">📦 Casa</button></div><section id="today" class="card"><h2>Hoy</h2><div id="todayContent"></div></section><section id="week" class="card hidden"><h2>📅 Menú semanal</h2><div id="weekContent"></div></section><section id="shop" class="card hidden"><h2>🛒 Compra</h2><p class="small">Lista orientativa para 4 personas. En la V3 se recalculará automáticamente según despensa y sobras.</p><div id="shopContent"></div></section><section id="home" class="card hidden"><h2>📦 Casa y sobras</h2><p class="small">Puedes escribir en lenguaje normal lo que tienes o lo que te ha sobrado.</p><textarea id="notes" rows="4" placeholder="Ej.: tengo 6 huevos y han sobrado 3 filetes de pollo"></textarea><button class="primary" onclick="saveNotes()">Guardar</button><p id="saved" class="small"></p><div id="stored"></div></section></main><script>const days=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];const menu=[['Lentejas con verduras y chorizo','Tortilla de patata + ensalada de tomate'],['Arroz con pollo y verduras','Ensalada de pasta con atún'],['Merluza al horno con patatas','Crema de verduras + tortilla francesa'],['Garbanzos con chorizo','Ensalada de tomate + huevos cocidos'],['Macarrones con carne picada y tomate','Pechuga de pollo a la plancha + ensalada'],['Pollo al horno con patatas','Croquetas + ensalada'],['Fabada','Pescado a la plancha + ensalada']];const shopping=['Patatas (3–4 kg)','Cebollas (1 kg)','Tomates (1,5 kg)','Lechuga/ensalada (2 unidades o bolsas)','Huevos (18)','Pechuga de pollo (1,2–1,5 kg)','Pescado blanco (800 g–1 kg)','Carne picada (750 g)','Chorizo (300–400 g)','Lentejas (500 g o 2 botes)','Garbanzos (2 botes grandes)','Macarrones (1 paquete)','Pasta (1 paquete)','Arroz (1 kg)','Atún (4 latas)','Verduras para crema (1–1,5 kg)','Croquetas (1 paquete)','Pan','Fruta variada'];function render(){const d=new Date().getDay();const i=(d+6)%7;document.getElementById('todayContent').innerHTML='<div class="tag">Comida</div><div class="meal">'+menu[i][0]+'</div><div class="tag">Cena</div><div class="meal">'+menu[i][1]+'</div>';document.getElementById('weekContent').innerHTML=menu.map((m,i)=>'<div class="day"><b>'+days[i]+'</b><div class="tag">Comida</div><div class="meal">'+m[0]+'</div><div class="tag">Cena</div><div class="meal">'+m[1]+'</div></div>').join('');document.getElementById('shopContent').innerHTML=shopping.map((x,i)=>'<label class="buy"><input type="checkbox" onchange="toggleBuy('+i+',this.checked)"><span>'+x+'</span></label>').join('');const n=localStorage.getItem('miMenuNotes')||'';document.getElementById('notes').value=n;document.getElementById('stored').innerHTML=n?'<hr><b>Guardado</b><p>'+escapeHtml(n)+'</p>':''}function show(id){['today','week','shop','home'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));}function saveNotes(){localStorage.setItem('miMenuNotes',document.getElementById('notes').value);document.getElementById('saved').textContent='Guardado en este dispositivo.';render()}function toggleBuy(i,v){const a=JSON.parse(localStorage.getItem('miMenuBuy')||'[]');a[i]=v;localStorage.setItem('miMenuBuy',JSON.stringify(a))}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
